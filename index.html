<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مصاريفي — متتبّع المصاريف الذكي</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <path d="M3 10h18"/><circle cx="16.5" cy="14" r="1.2" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>مصاريفي</h1>
        <p>تتبّع دخلك ومصروفاتك بذكاء</p>
      </div>
    </div>

    <div class="actions">
      <select id="currencySel" class="select-mini" title="العملة">
        <option value="ر.س">ر.س</option>
        <option value="د.إ">د.إ</option>
        <option value="ج.م">ج.م</option>
        <option value="د.ك">د.ك</option>
        <option value="ل.س">ل.س</option>
        <option value="$">$</option>
        <option value="€">€</option>
      </select>
      <button class="btn icon" id="themeBtn" title="تبديل المظهر">🌙</button>
      <button class="btn" id="exportBtn">⬇ تصدير CSV</button>
      <label class="btn" for="importInput">⬆ استيراد CSV</label>
      <input type="file" id="importInput" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <div class="toolbar card">
    <div class="tabs" id="periodTabs">
      <button data-period="day">اليوم</button>
      <button data-period="month" class="active">هذا الشهر</button>
      <button data-period="year">هذه السنة</button>
      <button data-period="all">الكل</button>
    </div>
    <div class="range-label" id="rangeLabel"></div>
  </div>

  <section class="stats">
    <div class="stat card in">
      <div class="stat-head"><span class="dot in"></span> إجمالي الدخل</div>
      <div class="stat-value in" id="statIncome">0</div>
      <div class="stat-sub" id="statIncomeSub">—</div>
    </div>
    <div class="stat card out">
      <div class="stat-head"><span class="dot out"></span> إجمالي المصاريف</div>
      <div class="stat-value out" id="statExpense">0</div>
      <div class="stat-sub" id="statExpenseSub">—</div>
    </div>
    <div class="stat card bal">
      <div class="stat-head"><span class="dot bal"></span> المتبقي معك</div>
      <div class="stat-value bal" id="statBalance">0</div>
      <div class="stat-sub" id="statBalanceSub">—</div>
    </div>
    <div class="stat card rate">
      <div class="stat-head"><span class="dot rate"></span> نسبة الإنفاق</div>
      <div class="stat-value rate" id="statRate">0%</div>
      <div class="stat-sub" id="statRateSub">—</div>
    </div>
  </section>

  <section class="dash">

    <div class="card col-4">
      <h2 class="card-title">➕ إضافة عملية</h2>
      <div class="seg" id="typeSeg">
        <button class="seg-btn active" data-type="expense">مصروف</button>
        <button class="seg-btn" data-type="income">دخل</button>
      </div>
      <form class="form" id="txForm" autocomplete="off">
        <label class="field">
          <span>المبلغ</span>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </label>
        <label class="field">
          <span>الفئة</span>
          <select id="category"></select>
        </label>
        <label class="field">
          <span>التاريخ</span>
          <input type="date" id="date" required>
        </label>
        <label class="field">
          <span>ملاحظة (اختياري)</span>
          <input type="text" id="note" maxlength="60" placeholder="مثال: غداء مع الأصدقاء">
        </label>
        <button class="btn primary" type="submit">＋ إضافة العملية</button>
      </form>
    </div>

    <div class="card col-4">
      <h2 class="card-title">🍩 توزيع المصاريف <span class="muted" id="donutPeriod"></span></h2>
      <div class="donut-wrap" id="donut"></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="card col-4">
      <h2 class="card-title">🎯 نسبة الإنفاق من الدخل</h2>
      <div class="ring-wrap" id="ring"></div>
      <div class="snapshot" id="snapshot"></div>
    </div>

    <div class="card col-12">
      <h2 class="card-title">📊 التطور المالي خلال آخر 6 أشهر</h2>
      <div class="bars-chart" id="bars"></div>
      <div class="bars-legend">
        <span><i style="background:linear-gradient(180deg,#22d38a,#0f9e68)"></i>الدخل</span>
        <span><i style="background:linear-gradient(180deg,#ff5c7c,#c9304f)"></i>المصاريف</span>
      </div>
    </div>

    <div class="card col-12">
      <div class="list-head">
        <h2 class="card-title" style="margin:0">📋 سجل العمليات <span class="muted" id="listCount"></span></h2>
        <button class="btn" id="clearBtn" style="font-size:.72rem">🗑 حذف الكل</button>
      </div>
      <div class="tx-list" id="txList"></div>
    </div>

  </section>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
